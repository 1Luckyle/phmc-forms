<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Prevent infinite redirect loop for /forms/* routes
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // Only redirect if not already at /forms or a subroute
        if (!/^\/forms(\/|$)/.test(pathname)) {
          var redirectUrl = '/forms' + pathname + search + hash;
          window.location.replace(redirectUrl);
        }
      })();
    </script>
    <title>Redirection...</title>
  </head>
  <body>
    <h1>Redirection...</h1>
    <p>Si vous n'êtes pas redirigé automatiquement, <a href="/forms/">cliquez ici</a>.</p>
  </body>
</html>
