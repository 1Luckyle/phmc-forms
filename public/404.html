<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/forms/" />
    <script type="text/javascript">
      // GitHub Pages 404 redirect for React Router
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var redirectUrl = '/forms' + pathname.replace(/^\/forms/, '') + search + hash;
        window.location.replace(redirectUrl);
      })();
    </script>
    <title>Redirecting...</title>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, <a href="/forms/">click here</a>.</p>
  </body>
</html>
